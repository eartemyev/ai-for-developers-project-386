name: dotnet-ci

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  build-test-docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore tests/BookACall.Api.Tests/BookACall.Api.Tests.csproj

      - name: Build BookACall.Api
        run: dotnet build src/BookACall.Api/BookACall.Api.csproj --configuration Release --no-restore

      - name: Test BookACall.Api.Tests
        run: dotnet test tests/BookACall.Api.Tests/BookACall.Api.Tests.csproj --configuration Release --verbosity normal

      - name: Build Docker image
        run: docker build -f src/BookACall.Api/Dockerfile -t bookacall-api:${{ github.sha }} .
